  NTW_EXPANSION_CHAIN_GRABBER:
    name: "Chain Grabber"
    lore:
      - "<passive>Grabs container items into the network in the set direction"
      - ""
      - "<click_info>Click the distance slot with an item<passive> the item amount is the distance"
      - "<passive>Put in <gold>Chain Modules<passive> to add more abilities"

  NTW_EXPANSION_CHAIN_PUSHER:
    name: "Chain Pusher"
    lore:
      - "<passive>Pushes the template item into the containers on the line in the set direction"
      - ""
      - "<click_info>Template slot<passive> put the items to push"
      - "<passive>Put in <gold>Chain Modules<passive> to add more abilities"

  NTW_EXPANSION_CHAIN_TRANSCEIVER:
    name: "Chain Transceiver"
    lore:
      - "<passive>On the same line, pushes the template item first, then grabs the target item back"
      - ""
      - "<click_info>Template slot<passive> put the items to push"
      - "<passive>Put in <gold>Chain Modules<passive> to add more abilities"

  NTW_EXPANSION_CHAIN_MODULE_RANGE:
    name: "Chain Distance Module"
    lore:
      - "<passive>Raises the transfer distance of chain machines"
      - ""
      - "<passive>Each piece gives <aqua>+16 blocks<passive>, up to 3 pieces"
      - "<click_info>Put in the module slot<passive> to take effect"

  NTW_EXPANSION_CHAIN_MODULE_CAPACITY:
    name: "Chain Capacity Module"
    lore:
      - "<passive>Adds template slots to the Pusher / Transceiver"
      - ""
      - "<passive>Each piece gives <aqua>+3 slots<passive>, up to 2 pieces"
      - "<error>The Grabber has no template slot, putting it in does nothing"

  NTW_EXPANSION_CHAIN_MODULE_MODE:
    name: "Chain Mode Module"
    lore:
      - "<passive>Unlocks changing the transfer mode"
      - ""
      - "<click_info>Put in the module slot<passive> to take effect"
      - "<click_info>Click the mode slot<passive> left or right click to change"

  NTW_EXPANSION_CHAIN_MODULE_VANILLA:
    name: "Chain Vanilla Container Module"
    lore:
      - "<passive>Lets chain machines recognize vanilla containers"
      - ""
      - "<click_info>Put in the module slot<passive> to take effect"

  NTW_EXPANSION_CHAIN_MODULE_MULTI_DIRECTION:
    name: "Chain Multi-direction Module"
    lore:
      - "<passive>Lets chain machines transfer in several directions at once"
      - ""
      - "<click_info>Click the direction slot<passive> to add or remove directions"

  NTW_EXPANSION_CHAIN_MODULE_BINDING:
    name: "Chain Binding Module"
    lore:
      - "<passive>Put it in a Pusher / Transceiver to unlock <gold>Split supply<passive>"
      - "<passive>Set which items to supply to each container on the line separately"
      - ""
      - "<click_info>Put in the module slot<passive> to take effect · Data is kept after taking it out"
  NTW_EXPANSION_CHAIN_CONFIGURATOR:
    name: "Chain Configurator"
    lore:
      - "<passive>Copy a whole line · One-click move"
      - ""
      - "<gold>[Left-click]<aqua> Source machine · Copy direction settings"
      - "<gold>[Right-click]<aqua> Target machine · Write by distance"
      - "<gold>[Shift+Swing at air]<aqua> Clear saved settings"
      - "<passive>Sneak when applying · Only writes the list, not the mode"

  NTW_EXPANSION_CHAIN_BRUSH:
    name: "Chain List Brush"
    lore:
      - "<passive>Click to change · Feed from far away"
      - ""
      - "<gold>[Right-click]<aqua> Machine on the line · Go straight to list editing"
      - "<gold>[Shift+Right-click]<aqua> Machine on the line · Clear that slot's list"
      - "<gold>[Right-click]<aqua> Pusher · Open the direction page"
      - "<passive>On the direction page, right-click a direction · Bulk write the whole direction"

  NTW_EXPANSION_RUNE_COLLECT:
    name: "Network Rune"
    lore:
      - "<passive>Craft it by dropping it next to a sword, pickaxe, axe, hoe or shovel"
      - "<success>Kill mobs and mine with it, drops go straight into the bound network"
      - ""
      - "<click_info>Sneak + right-click a controller<passive> to bind the network"
      - "<click_info>Sneak + right-click air<passive> to change mode"

