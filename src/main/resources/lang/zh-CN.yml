items:
  # DO NOT CHANGE OR DELETE THESE ANNOUNCEMENTS
  NTW_EXPANSION_ANNOUNCEMENT_01:
    name: "<color_random_string>Definitions"
    lore:
      - "<warning> 1) Statement refers to all statements here."
      - "<warning> 2) Networks refers to a Slimefun addon, not the network in the sense of the internet, IoT, or any other traditional network."
      - "<warning> 3) NetworksExpansion (below called \"Networks Expansion\", \"this addon\" or \"this project\") refers to a Slimefun addon made by the Networks Expansion dev team based on Networks, fully following the GPLv3 license with some changes, additions and removals. It is developed on Paper 1.20.1 with the Chinese-translated Slimefun, and is not fully compatible with Paper 1.20.5 and above."
      - "<warning> 4) The Networks Expansion developers (below called \"Networks Expansion dev team\" or \"Networks Expansion creators\") are the group that develops Networks Expansion, and are not owned by any company or organization."
  NTW_EXPANSION_ANNOUNCEMENT_02:
    name: "<color_random_string>Networks Expansion Work Statement"
    lore:
      - "<warning> Before reading this statement, please read the Definitions first."
      - "<warning> 1) Networks Expansion is completely free, shared, and open source on GitHub, for supporters, maintainers and creators to learn from and use."
      - "<warning> 2) The GPLv3 license is the open source license of Networks Expansion. Anyone can freely use, change and share it, but any change or sharing must follow the GPLv3 license."
      - "<warning> 3) \"Networks Expansion\" here is only the title of this file, with no hidden meaning and nothing about making money."
      - "<warning> 4) The Networks Expansion developers are only the creators of this addon. They don't offer any commercial support and no longer actively maintain this addon. They also never take part in any direct or indirect business of any server."
      - "<warning> 5) It is strictly forbidden to use the above plugins and this addon to promote any kind of negative or violent content, to do anything illegal or infringing, or to involve any politics or vulgar content."
      - "<warning> 6) Reselling is strictly forbidden, including but not limited to disguised trading, or secretly changing and using the above files to make any profit."
      - "<warning> 7) We strongly condemn the forbidden things above, and encourage everyone to watch each other and report rule-breaking and illegal behavior."
      - "<warning> 8) You or your group must take responsibility for any result caused by your improper use. It is strictly forbidden to shift the blame in any way to the maintainers and creators of the above plugins and config files."
      - "<warning> 9) Infringers should, depending on the case, take civil responsibility such as stopping the infringement, removing the effects, apologizing and paying for the loss. If public interest is also harmed, the copyright administration department may order the infringement to stop, take the illegal income, take and destroy the infringing copies, and may also fine. If the case is serious and counts as a crime, criminal responsibility will be pursued by law."
      - "<warning> 10) When the Networks Expansion developers don't go after an infringer, it doesn't mean they approve of the infringement. It also doesn't mean the infringer doesn't have to take any responsibility."
      - "<warning> Please make sure you follow the statements above."
  NTW_EXPANSION_ANNOUNCEMENT_03:
    name: "<color_random_string>Networks Expansion Author Statement"
    lore:
      - "<warning> Before reading this statement, please read the Networks Expansion Usage Statement first."
      - "<warning> 1) All members of the Networks Expansion dev team are citizens of the People's Republic of China, sincerely agree with the theory of socialism with Chinese characteristics, and uphold the leadership of the Communist Party of China."
      - "<warning> 2) The Networks Expansion dev team members oppose outdated ideas such as capitalism, imperialism, hegemonism and feudalism."
      - "<warning> 3) The Networks Expansion dev team members follow the constitution and laws, and oppose cyberbullying."
      - "<warning> 4) The Networks Expansion dev team members follow the community rules, don't use bad language, and communicate politely."
      - "<warning> 5) Insulting or attacking the Networks Expansion dev team or its members will be dealt with by law, and if “doxxing” or other cyberbullying is found, the police will be called."
      - "<warning> 6) This statement only represents the position of the Networks Expansion dev team, not anyone else, any game, organization, company, country or social group, and not any game's player community."
      - "<warning> 7) This statement doesn't take any side on purpose, it's only about the matter itself, not about people."
      - "<passive> This addon was written by Sefiraat, translated into Chinese by ybw0014, and extended, changed and kept up by yitoudaidai and tinalness."
      - "<passive> Thanks to the machines of LogiTech for providing the author head hash."
      - "<passive> Thanks to all server owners who trusted and installed Networks Expansion."
      - "<passive> This addon was inspired by many players."
      - "<passive> Special thanks to players like Utoboy, TouRuya, haiman233 and matl114 for their ideas."
      - "<passive> Thanks to testers like Utoboy, TouRuya, haiman233, yitoudaidai, tinalness, matl114 and lengshang for testing."
  NTW_EXPANSION_ANNOUNCEMENT_04:
    name: "<color_random_string>Networks Expansion Links"
    lore:
      - "<warning> Before reading this statement, please read the Networks Expansion Author Statement first."
      - "<passive> Here are the links for Networks Expansion: (please only trust these links)"
      - "<passive> Networks Expansion build site: <click_info>https://builds.guizhanss.com/ytdd9527/NetworksExpansion/master/builds"
      - "<passive> Networks Expansion stable GitHub repo: <click_info>https://github.com/ytdd9527/NetworksExpansion"
      - "<passive> Networks Expansion stable GitHub Issues: <click_info>https://github.com/ytdd9527/NetworksExpansion/issues"
      - "<passive> Networks Expansion stable GitHub PRs: <click_info>https://github.com/ytdd9527/NetworksExpansion/pulls"
      - "<passive> Networks Expansion dev GitHub repo: <click_info>https://github.com/balugaq/NetworksExpansion"
      - "<warning> The Networks Expansion dev version doesn't accept GitHub Issues"
      - "<warning> The Networks Expansion dev version doesn't accept GitHub PRs"
      - "<passive> Networks Expansion author GitHub page: <click_info>https://github.com/ytdd9527"
      - "<passive> Networks Expansion author GitHub page: <click_info>https://github.com/balugaq"
  NTW_EXPANSION_ANNOUNCEMENT_05:
    name: "<color_random_string>Networks Expansion Links"
    lore:
      - "<warning> Before reading this statement, please read the Networks Expansion Q&A first."
      - "<warning> 1) The Networks Expansion developers have no duty to maintain this addon. If a bug, hole or problem suddenly shows up in the stable version, please submit an Issue to the stable GitHub repo of this addon."
      - "<passive> 2) We can't promise to fix every problem on time, but we will try our best."
      - "<passive> 3) When talking with the developers, stay polite, and don't attack or insult them. This is the way to actually get your problem solved."
      - "<warning> 4) When you use, play or modify Networks Expansion, it means you agree to follow these statements."
      - "<passive> 5) The Networks Expansion developers can change or end this statement at any time."
      - "<warning> 6) After this statement is updated, you should check by yourself if you have any objection. Usually, after a version update, the Networks Expansion dev team assumes you agree to follow these statements."
      - "<passive> 7) Please avoid getting \"Networks Expansion\", the \"Networks Expansion dev team\" or any \"Networks Expansion dev team member\" involved in politics or public events by using Networks Expansion. <warning>Otherwise the dev team has the right to pause or end maintenance of Networks Expansion."
      - "<passive> 8) If the developers release this statement in another language, the Chinese version is the one that counts."
      - "<passive> 9) The validity, performance, interpretation and dispute settlement of this statement are governed by the laws of mainland China (not including conflict of laws)"
      - "<passive> 10) All titles in this statement are only for easy reading. They have no real meaning and can't be used to interpret this statement."
      - "<warning> 11) If any part of this statement becomes invalid for any reason, the other terms still stay valid and bind all sides."
      - "<warning> 12) If the screen is too small or similar and you can't see the full statement, please adjust it yourself. The Networks Expansion dev team takes no responsibility for this."
      - "<warning> 13) If the screen is too small or similar and you can't see the full item name or item description, the server owner or player should sort it out. The Networks Expansion dev team takes no responsibility for this."
      - "<warning> 14) Networks Expansion allows anyone to use, copy, change, merge, publish, distribute, show and share this statement for non-profit purposes, but nobody may use this statement for commercial purposes. Also, any promotion in the name of Networks Expansion or the Networks Expansion dev team is forbidden."
      - "<warning> 15) The right to interpret all statements of this addon belongs to the Networks Expansion developers."
  NTW_EXPANSION_ANNOUNCE_9:
    name: "<color_random_string>Networks Expansion Version Info"
    lore:
      - "<warning> Before reading this statement, please read the Networks Expansion Extra Notes first."
      - "<passive> Developer(s): ytdd9527, balugaq"
      - "<passive> Developer GitHub page: <click_info>https://github.com/ytdd9527"
      - "<passive> Developer GitHub page: <click_info>https://github.com/balugaq"
      - "<passive> Networks Expansion stable download: https://builds.guizhanss.com/ytdd9527/NetworksExpansion/master/builds"
      - "<passive> Networks Expansion dev download: https://github.com/balugaq/NetworksExpansion"
      - "<passive> Thanks to everyone who contributed an Issue, PR or commit to Networks Expansion!"
      - "<passive> Thanks to everyone who gave suggestions for Networks Expansion!"
      - "<passive> Thanks to players who gave suggestions for Networks Expansion like Utoboy, TouRuya, haiman233, yitoudaidai, tinalness and matl114!"
  NTW_EXPANSION_ANNOUNCE_10:
    name: "<color_random_string>Networks Expansion Play Experience Statement"
    lore:
      - "<warning> Before reading this statement, please read the Networks Expansion Version Info first."
      - "<passive> About the Network Crafter dropping blueprints, according to an announcement from the Slimefun developers:"
      - "<passive> —— When an item's PDC data is too big, the item can't be saved in the Slimefun database. The server owner needs to change the database table data type"
      - "<passive> —— and turn on the `bypass-item-length-check` option in the settings to skip the item size check."
      - "<passive> The blueprint PDC of the Network Crafter is usually very big, to stay compatible with blueprints from years ago and keep the play experience good for players."
      - "<passive> Also, according to matl114's tests, upgrading a machine in place can also make items disappear:"
      - "<passive> Here is an example that <warning>may<passive> be reproduced: place machine A, put C items of D in slot B, break it and swap it to machine E, put C items of D in slot B,"
      - "<passive> after the server restarts, the D items in machine E disappear."
      - "<passive> The reasons above have little to do with Networks Expansion. Please stay calm when playing, and don't blindly attack Networks Expansion with words."
      - "<passive> End of statement."

  NTW_EXPANSION_WORKBENCH:
    name: "Networks Expansion Workbench"
    lore:
      - "Can craft various materials and machines of Networks Expansion"

  NTW_EXPANSION_INFO_TOOL:
    name: "Network Info Tool"
    lore:
      - "Admin only"
      - "Right-click to see detailed info about the items in the network"

  NTW_EXPANSION_ADVANCED_IMPORT:
    name: "Advanced Network Input"
    lore:
      - "The Advanced Network Input sends the items inside it into the network"
      - "Can move up to 54 stacks of items every SF tick"
      - "Can receive items from the Cargo network"

  NTW_EXPANSION_ADVANCED_EXPORT:
    name: "Advanced Network Output"
    lore:
      - "The Advanced Network Output can be set to"
      - "keep sending the set amount of items out of the network"
      - "You can use the Cargo network to take items out of it"

  NTW_EXPANSION_ADVANCED_PURGER:
    name: "Advanced Network Cleaner"
    lore:
      - "The Advanced Network Cleaner keeps"
      - "removing the set items from the network"
      - "Cleared items disappear right away, use with care!"

  NTW_EXPANSION_ADVANCED_GREEDY_BLOCK:
    name: "Advanced Network Blocker"
    lore:
      - "The Advanced Network Blocker can set one item,"
      - "then collects the set item from inputs"
      - "all over the network, up to 9 stacks."
      - "When it's full, it blocks that item from moving in the network,"
      - "and no other network block will get that item."

  NTW_EXPANSION_CAPACITOR_5:
    name: "Network Capacitor (5)"
    lore:
      - "The Network Capacitor can receive power from"
      - "the energy network and store it"
      - "for other network devices to use"
      - ""
      - "<click_info>Capacity: &7100,000,000"

  NTW_EXPANSION_CAPACITOR_6:
    name: "Network Capacitor (6)"
    lore:
      - "The Network Capacitor can receive power from"
